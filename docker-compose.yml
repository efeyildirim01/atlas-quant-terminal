# Local development stack. NOT YET EXECUTED: the machine this was written on has no Docker.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 5s
      retries: 20

  redis:
    # Shared rate limits and login lockout across API instances (ATLAS_REDIS_URL).
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atlas}
    command: ["sh", "-c", "alembic upgrade head && python -m app.workers.cli ingest"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atlas}
      ATLAS_REDIS_URL: redis://redis:6379/0
      # The web container's rewrite proxy forwards browser requests; trust X-Forwarded-For only from the compose network.
      ATLAS_TRUSTED_PROXIES: 127.0.0.1/32,172.16.0.0/12
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile, args: { ATLAS_API_URL: "http://api:8000" } }
    environment: { ATLAS_API_URL: "http://api:8000" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
